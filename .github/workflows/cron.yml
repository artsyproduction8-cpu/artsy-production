name: Cron Jobs

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  reconcile-payments:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Payment Reconciliation
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/reconcile-payments" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f

  timeouts:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Timeout Checks
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/timeouts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f
